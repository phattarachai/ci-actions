name: Laravel migrate
description: >-
  Run a deploy's migrations behind a rollback point: when migrations are pending, take a database
  snapshot (spatie/laravel-db-snapshots) first, then run migrate. Nothing pending skips the snapshot.

inputs:
  working-directory:
    description: >-
      The deployed app's directory. Required: a job's defaults.run.working-directory does not reach
      into a composite action, so leaving it out would migrate the runner's checkout instead.
    required: true
  artisan:
    description: How to call artisan, e.g. `php artisan` or `sudo php artisan`.
    required: false
    default: php artisan
  snapshot:
    description: "'true' takes a snapshot before pending migrations; 'false' only migrates."
    required: false
    default: 'true'
  compress:
    description: "'true' passes --compress to snapshot:create (the production rollback dump is gzipped)."
    required: false
    default: 'true'
  on-snapshot-failure:
    description: >-
      'stop' fails the step and leaves the schema untouched; 'continue' warns and migrates without a
      rollback point.
    required: false
    default: stop
  db-username:
    description: >-
      Run migrate:status, snapshot:create and migrate as this DB user, e.g. `myapp_owner`, with
      DB_PASSWORD empty: the owner role has no password and logs in over the unix socket. Empty
      keeps the app's own user from .env.
    required: false
    default: ''
  db-host:
    description: >-
      DB_HOST for those calls. For pgsql peer auth, the socket directory, e.g. `/var/run/postgresql`.
    required: false
    default: ''
  db-socket:
    description: >-
      DB_SOCKET for those calls. For MySQL auth_socket, e.g. `/run/mysqld/mysqld.sock`.
    required: false
    default: ''
  extra-env:
    description: >-
      More env for those calls, one KEY=VALUE per line (e.g. a second connection's LOG_DB_USERNAME).
      The value is literal and may be empty; blank lines and # comments are skipped. Only keys are
      printed. Any override input fails the step when bootstrap/cache/config.php exists.
    required: false
    default: ''

outputs:
  has-pending:
    description: "'true' when migrations were pending (or migrate:status failed), else 'false'."
    value: ${{ steps.migrate.outputs.has-pending }}
  snapshot:
    description: "'created', 'skipped' or 'failed'."
    value: ${{ steps.migrate.outputs.snapshot }}

runs:
  using: composite
  steps:
    - id: migrate
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ARTISAN: ${{ inputs.artisan }}
        SNAPSHOT: ${{ inputs.snapshot }}
        COMPRESS: ${{ inputs.compress }}
        ON_SNAPSHOT_FAILURE: ${{ inputs.on-snapshot-failure }}
        MIGRATE_DB_USERNAME: ${{ inputs.db-username }}
        MIGRATE_DB_HOST: ${{ inputs.db-host }}
        MIGRATE_DB_SOCKET: ${{ inputs.db-socket }}
        MIGRATE_EXTRA_ENV: ${{ inputs.extra-env }}
      run: '"$GITHUB_ACTION_PATH/migrate.sh"'
